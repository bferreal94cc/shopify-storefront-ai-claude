name: One-time Storefront API client install

on:
  push:
    branches:
      - feat/shopify-mcp-agent-rules-7

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Storefront API client
        run: npm install @shopify/storefront-api-client --save

      - name: Commit dependency changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "feat: add Shopify Storefront API client"
          rm .github/workflows/one-time-storefront-client-install.yml
          git add .github/workflows/one-time-storefront-client-install.yml
          git commit -m "chore: remove one-time dependency installer"
          git push