[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storefront-agent"
version = "0.1.0"
description = "Multi-storefront automation: product research, cross-channel listing, order-to-ship fulfilment, batched owner approvals, marketing and social."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
google = ["google-adk>=0.1.0"]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
storefront-agent = "storefront_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
